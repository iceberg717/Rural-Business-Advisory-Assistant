<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}RuralBiz Advisor | Mehsana AI Advisory{% endblock %}</title>
    <meta name="description"
        content="AI-powered rural business advisory platform offering MSME market intelligence, competitor analysis, and government scheme recommendations for Mehsana district.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Outfit:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/professional.css') }}">
    {% block extra_head %}{% endblock %}
</head>

<body>
    <header class="site-header">
        <a class="brand" href="{{ url_for('home') }}" id="brand-logo">
            <span class="brand-mark">RB</span>
            <span>RuralBiz Advisor</span>
        </a>
        <nav class="nav-links" aria-label="Main navigation">
            <a href="{{ url_for('home') }}" id="nav-dashboard">Dashboard</a>
            <a href="{{ url_for('chat') }}" id="nav-advisor">AI Advisor</a>
            {% if user and user.username %}
            <span class="user-badge">👤 {{ user.username }}</span>
            <a href="{{ url_for('logout') }}" id="nav-logout">Log out</a>
            {% else %}
            <a href="{{ url_for('login') }}" id="nav-login">Log in</a>
            <a href="{{ url_for('register') }}" id="nav-register">Register</a>
            {% endif %}
        </nav>
    </header>
    <main id="main-content">
        {% block content %}{% endblock %}
    </main>
    <script src="{{ url_for('static', path='js/chat.js') }}"></script>
    {% block extra_scripts %}{% endblock %}
</body>

</html>
